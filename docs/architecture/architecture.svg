<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Calibri, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#44546A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="560" fill="#FFFFFF"/>
  <text x="30" y="26" font-size="20" font-weight="700" fill="#1F3864">Voxcribe architecture</text>

  <!-- Browser -->
  <rect x="30" y="45" width="220" height="475" rx="6" fill="#FFFFFF" stroke="#44546A" stroke-width="1.5"/>
  <text x="46" y="72" font-size="17" font-weight="700" fill="#1F3864">Browser</text>
  <rect x="45" y="95" width="190" height="64" rx="5" fill="#E9EEF5" stroke="#1F3864" stroke-width="1.5"/>
  <text x="140" y="124" font-size="15" text-anchor="middle" fill="#1A1A1A">Opens the pages</text>
  <text x="140" y="144" font-size="13" text-anchor="middle" fill="#404040">Next.js, React</text>
  <rect x="45" y="235" width="190" height="64" rx="5" fill="#E9EEF5" stroke="#1F3864" stroke-width="1.5"/>
  <text x="140" y="264" font-size="15" text-anchor="middle" fill="#1A1A1A">Dashboard and history</text>
  <text x="140" y="284" font-size="13" text-anchor="middle" fill="#404040">Search, edit, delete</text>
  <rect x="45" y="330" width="190" height="64" rx="5" fill="#E9EEF5" stroke="#1F3864" stroke-width="1.5"/>
  <text x="140" y="359" font-size="15" text-anchor="middle" fill="#1A1A1A">Transcribe page</text>
  <text x="140" y="379" font-size="13" text-anchor="middle" fill="#404040">Microphone, live text</text>

  <!-- Frontend container -->
  <rect x="330" y="45" width="230" height="130" rx="6" fill="#FFFFFF" stroke="#44546A" stroke-width="1.5"/>
  <text x="346" y="72" font-size="17" font-weight="700" fill="#1F3864">Frontend container</text>
  <rect x="345" y="95" width="200" height="64" rx="5" fill="#E9EEF5" stroke="#1F3864" stroke-width="1.5"/>
  <text x="445" y="124" font-size="15" text-anchor="middle" fill="#1A1A1A">Web server</text>
  <text x="445" y="144" font-size="13" text-anchor="middle" fill="#404040">Serves the pages</text>

  <!-- Backend container -->
  <rect x="330" y="195" width="470" height="325" rx="6" fill="#FFFFFF" stroke="#44546A" stroke-width="1.5"/>
  <text x="346" y="222" font-size="17" font-weight="700" fill="#1F3864">Backend container (FastAPI)</text>
  <rect x="345" y="235" width="200" height="64" rx="5" fill="#E9EEF5" stroke="#1F3864" stroke-width="1.5"/>
  <text x="445" y="264" font-size="15" text-anchor="middle" fill="#1A1A1A">Web requests</text>
  <text x="445" y="284" font-size="13" text-anchor="middle" fill="#404040">Create, list, edit, delete</text>
  <rect x="345" y="330" width="200" height="64" rx="5" fill="#E9EEF5" stroke="#1F3864" stroke-width="1.5"/>
  <text x="445" y="359" font-size="15" text-anchor="middle" fill="#1A1A1A">Live connection</text>
  <text x="445" y="379" font-size="13" text-anchor="middle" fill="#404040">Sound in, text out</text>
  <rect x="595" y="330" width="190" height="64" rx="5" fill="#E9EEF5" stroke="#1F3864" stroke-width="1.5"/>
  <text x="690" y="359" font-size="15" text-anchor="middle" fill="#1A1A1A">Streaming session</text>
  <text x="690" y="379" font-size="13" text-anchor="middle" fill="#404040">Settles text, drops sound</text>
  <rect x="595" y="430" width="190" height="64" rx="5" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/>
  <text x="690" y="459" font-size="15" text-anchor="middle" fill="#FFFFFF" font-weight="700">Speech model</text>
  <text x="690" y="479" font-size="13" text-anchor="middle" fill="#FFFFFF">Faster-Whisper, in the image</text>

  <!-- Database container -->
  <rect x="860" y="195" width="210" height="325" rx="6" fill="#FFFFFF" stroke="#44546A" stroke-width="1.5"/>
  <text x="876" y="222" font-size="17" font-weight="700" fill="#1F3864">Database container</text>
  <rect x="875" y="235" width="180" height="64" rx="5" fill="#E9EEF5" stroke="#1F3864" stroke-width="1.5"/>
  <text x="965" y="264" font-size="15" text-anchor="middle" fill="#1A1A1A">PostgreSQL</text>
  <text x="965" y="284" font-size="13" text-anchor="middle" fill="#404040">Saved transcripts</text>

  <!-- arrows -->
  <line x1="237" y1="127" x2="343" y2="127" stroke="#44546A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="117" font-size="12" text-anchor="middle" fill="#404040">page files</text>
  <line x1="237" y1="267" x2="343" y2="267" stroke="#44546A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="257" font-size="12" text-anchor="middle" fill="#404040">requests</text>
  <line x1="237" y1="362" x2="343" y2="362" stroke="#44546A" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="290" y="352" font-size="12" text-anchor="middle" fill="#404040">sound, text</text>
  <line x1="547" y1="362" x2="593" y2="362" stroke="#44546A" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="396" x2="690" y2="428" stroke="#44546A" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="547" y1="267" x2="873" y2="267" stroke="#44546A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="257" font-size="12" text-anchor="middle" fill="#404040">saved transcripts</text>
</svg>
